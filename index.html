<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omsætnings-dashboard</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mu:#6b7280;--bd:#e3e6ea;--ac:#2563eb;--ok:#16a34a;--bad:#dc2626;--wa:#d97706;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#181c25;--tx:#e8ebf0;--mu:#8b93a1;--bd:#2a303c;--ac:#60a5fa;--ok:#4ade80;--bad:#f87171;--wa:#fbbf24}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#181c25;--tx:#e8ebf0;--mu:#8b93a1;--bd:#2a303c;--ac:#60a5fa;--ok:#4ade80;--bad:#f87171;--wa:#fbbf24}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{font-size:.75rem;color:var(--mu);display:block;margin-bottom:4px}
input,button{font:inherit;padding:9px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input[type=number]{width:130px}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.k div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.k small{color:var(--mu);font-size:.72rem;display:block}
.k b{font-size:1.25rem;display:block;margin-top:2px}
.bar{height:12px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac);width:0}
.ch{overflow-x:auto}svg{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:500;font-size:.72rem}
td input{width:100px;padding:5px 7px;text-align:right}
tr.t td{background:color-mix(in srgb,var(--ac) 10%,transparent)}
tr.we td{color:var(--mu)}
.tw{overflow-x:auto}
.g{color:var(--ok)}.r{color:var(--bad)}.o{color:var(--wa)}
</style>
</head>
<body>
<div class="w">
<h1>📈 Omsætnings-dashboard</h1>

<div class="card row">
 <div><label>Måned</label><input type="month" id="mo"></div>
 <div><label>Månedsmål (kr.)</label><input type="number" id="goal" min="0" step="1000"></div>
 <div><label>Timer mandag</label><input type="number" id="hm" min="0" step="0.5" style="width:90px"></div>
 <div><label>Timer øvrige hverdage</label><input type="number" id="ho" min="0" step="0.5" style="width:90px"></div>
 <div><label>Timer weekend</label><input type="number" id="hw" min="0" step="0.5" style="width:90px"></div>
</div>

<div class="card row">
 <div><label>Dato</label><input type="date" id="qd"></div>
 <div><label>Omsætning (kr.)</label><input type="number" id="qa" step="0.01" placeholder="0"></div>
 <button id="qs">Gem dag</button>
</div>

<div class="k" id="k"></div>
<div class="card" style="margin-top:12px"><small style="color:var(--mu)">Målopnåelse</small><div class="bar"><i id="pb"></i></div></div>
<div class="card ch"><svg id="ch" viewBox="0 0 640 260"></svg></div>
<div class="card tw"><table><thead><tr><th>Dag</th><th>Omsætning</th><th>Akkumuleret</th><th>Mål akk.</th><th>Index</th><th>Fri</th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
<script>
const $=id=>document.getElementById(id);
const KEY='oms-dash-v1';
let S={goals:{},hours:{mon:10,oth:6,we:0},data:{}};
try{const s=localStorage.getItem(KEY);if(s)S=Object.assign(S,JSON.parse(s))}catch(e){}
if(!S.hours)S.hours={mon:10,oth:6,we:0};
if(!S.off)S.off={};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const kr=n=>Math.round(n).toLocaleString('da-DK')+' kr.';
const now=new Date(),todayIso=iso(now);
$('mo').value=todayIso.slice(0,7);$('qd').value=todayIso;

function render(){
 const m=$('mo').value||todayIso.slice(0,7);
 const [Y,M]=m.split('-').map(Number);
 const N=new Date(Y,M,0).getDate();
 const goal=(m in S.goals)?(+S.goals[m]||0):180000;
 const HR=S.hours;
 $('goal').value=goal||'';$('hm').value=HR.mon;$('ho').value=HR.oth;$('hw').value=HR.we;
 const days=[];
 for(let d=1;d<=N;d++){
  const dt=new Date(Y,M-1,d),k=iso(dt),dow=dt.getDay(),we=dow===0||dow===6;
  const off=!!S.off[k];
  const w=off?0:we?HR.we:dow===1?HR.mon:HR.oth;
  days.push({d,k,we,w,off,count:w>0,v:S.data[k]});
 }
 const tw=days.reduce((a,x)=>a+x.w,0)||1;
 const per=goal/tw;
 let acc=0,tacc=0;
 days.forEach(x=>{
  tacc+=per*x.w;x.tacc=tacc;
  if(x.v!=null)acc+=x.v;x.acc=acc;
 });
 const cur=m===todayIso.slice(0,7),past=m<todayIso.slice(0,7);
 const lim=past?'9999':cur?todayIso:'0000';
 const actual=days.filter(x=>x.k<=lim).reduce((s,x)=>s+(x.v||0),0);
 const total=days.reduce((s,x)=>s+(x.v||0),0);
 const el=days.filter(x=>x.count&&x.k<=lim);
 const elapsed=el.length;
 const exp=elapsed?el[el.length-1].tacc:0;
 const idx=exp>0?actual/exp*100:null;
 const rem=days.filter(x=>x.count&&x.k>=(cur?todayIso:'9999')&&x.v==null);
 const remDays=rem.length;
 const remH=rem.reduce((a,x)=>a+x.w,0);
 const td=days.find(x=>x.k===todayIso);
 const need=Math.max(0,goal-total);
 const req=remH>0?need/remH:0;
 const fc=exp>0?actual/exp*goal:0;
 const ic=idx==null?'':idx>=100?'g':idx>=90?'o':'r';
 $('k').innerHTML=[
  ['Omsætning hidtil',kr(total),''],
  ['Månedsmål',goal?kr(goal):'–',''],
  ['Mangler til mål',goal?kr(need):'–',''],
  ['Index (100 = på mål)',idx==null?'–':idx.toFixed(0),ic],
  ['Arbejdsdage',days.filter(x=>x.count).length+' ('+days.filter(x=>x.off).length+' fri)',''],
  ['Mål mandag',goal?kr(per*HR.mon):'–',''],
  ['Mål øvrige hverdage',goal?kr(per*HR.oth):'–',''],
  ['Skal nå pr. time (resten)',goal&&remH?kr(req):'–',''],
  ['Skal nå i dag',goal&&cur&&td&&td.count&&td.v==null?kr(req*td.w):'–',''],
  ['Prognose ultimo',elapsed?kr(fc):'–',goal&&elapsed?(fc>=goal?'g':'r'):''],
  ['Dage tilbage',cur?remDays:'–','']
 ].map(a=>`<div><small>${a[0]}</small><b class="${a[2]}">${a[1]}</b></div>`).join('');
 $('pb').style.width=(goal?Math.min(100,total/goal*100):0)+'%';

 // chart
 const W=640,H=260,L=56,R=12,T=14,B=26,pw=W-L-R,ph=H-T-B;
 const mx=Math.max(goal,total,fc,1)*1.05;
 const X=d=>L+(d-1)/Math.max(N-1,1)*pw,Yy=v=>T+ph-v/mx*ph;
 let s='';
 for(let i=0;i<=4;i++){const v=mx*i/4,y=Yy(v);s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="${L-6}" y="${y+4}" font-size="11" text-anchor="end" fill="var(--mu)">${v>=1000?Math.round(v/1000)+'k':Math.round(v)}</text>`}
 [1,Math.ceil(N/2),N].forEach(d=>s+=`<text x="${X(d)}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--mu)">${d}.</text>`);
 s+=`<polyline fill="none" stroke="var(--mu)" stroke-width="2" stroke-dasharray="6 5" points="${days.map(x=>X(x.d)+','+Yy(x.tacc)).join(' ')}"/>`;
 const pts=days.filter(x=>x.k<=lim).map(x=>X(x.d)+','+Yy(x.acc));
 if(pts.length)s+=`<polyline fill="none" stroke="var(--ac)" stroke-width="3" stroke-linejoin="round" points="${pts.join(' ')}"/>`;
 s+=`<text x="${L+6}" y="${T+12}" font-size="11" fill="var(--ac)">— Faktisk</text><text x="${L+70}" y="${T+12}" font-size="11" fill="var(--mu)">- - Mål</text>`;
 $('ch').innerHTML=s;

 // table
 const dn=['søn','man','tir','ons','tor','fre','lør'];
 $('tb').innerHTML=days.map(x=>{
  const ix=x.count&&x.tacc>0&&x.k<=lim?x.acc/x.tacc*100:null;
  const c=ix==null?'':ix>=100?'g':ix>=90?'o':'r';
  return `<tr class="${x.k===todayIso?'t':''} ${x.we?'we':''}"><td>${dn[new Date(x.k).getDay()]} ${x.d}.</td><td><input type="number" step="0.01" data-k="${x.k}" value="${x.v!=null?x.v:''}"></td><td>${x.k<=lim||x.v!=null?kr(x.acc):'–'}</td><td>${x.count?kr(x.tacc):'–'}</td><td class="${c}">${ix==null?'–':ix.toFixed(0)}</td><td><input type="checkbox" data-o="${x.k}" ${x.off?'checked':''}></td></tr>`;
 }).join('');
 document.querySelectorAll('#tb input[data-k]').forEach(i=>i.onchange=()=>setDay(i.dataset.k,i.value));
 document.querySelectorAll('#tb input[data-o]').forEach(i=>i.onchange=()=>{if(i.checked)S.off[i.dataset.o]=true;else delete S.off[i.dataset.o];save();render()});
}
function setDay(k,v){
 if(v===''||isNaN(+v))delete S.data[k];else S.data[k]=+v;
 save();render();
}
$('mo').onchange=render;
$('goal').onchange=()=>{S.goals[$('mo').value]=+$('goal').value||0;save();render()};
[['hm','mon'],['ho','oth'],['hw','we']].forEach(([id,key])=>$(id).onchange=()=>{S.hours[key]=Math.max(0,+$(id).value||0);save();render()});
$('qs').onclick=()=>{
 const k=$('qd').value,v=$('qa').value;
 if(!k||v==='')return;
 setDay(k,v);$('qa').value='';
 $('mo').value=k.slice(0,7);render();
};
render();
</script>
</body>
</html>
